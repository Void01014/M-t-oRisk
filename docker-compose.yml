services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data

  meteorisK-db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meteorisK

  airflow:
    build: .
    depends_on:
      - postgres
      - meteorisK-db
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: meteorisK-secret-key
    volumes:
      - .:/opt/meteorisK
    command: webserver

  scheduler:
    build: .
    depends_on:
      - postgres
      - meteorisK-db
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: meteorisK-secret-key
    volumes:
      - .:/opt/meteorisK
    command: scheduler

  streamlit:
    build: .
    depends_on:
      - meteorisK-db
    ports:
      - "8501:8501"
    volumes:
      - .:/opt/meteorisK
    working_dir: /opt/meteorisK
    environment:
      PYTHONPATH: /opt/meteorisK
    entrypoint: []
    command: streamlit run dashboard/app.py --server.address=0.0.0.0

  init-db:
    build: .
    depends_on:
      - meteorisK-db
    volumes:
      - .:/opt/meteorisK
    working_dir: /opt/meteorisK
    environment:
      PYTHONPATH: /opt/meteorisK
    command: python init_db.py

volumes:
  airflow-postgres-data: